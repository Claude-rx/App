      // Function to update the price element with the new variant price
      function updateProductPrice(newPrice) {
        const priceElement = document.getElementById('productpricingnew');
        if (!priceElement) return;
        priceElement.textContent = newPrice;
      }

      // Event listener to detect changes in the variant selection
      document.addEventListener('DOMContentLoaded', function () {
        // Assuming the variant change triggers an update on the element with class 'product__price--regular'
        const regularPriceElement = document.querySelector('.product__price--regular');

        if (regularPriceElement && document.getElementById('productpricingnew')) {
          const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
              // Update the `productpricingnew` element with the new price when it changes
              updateProductPrice(mutation.target.textContent);
            });
          });

          // Observe changes in the regular price element
          observer.observe(regularPriceElement, {
            childList: true,
            subtree: true,
          });
        }
      });
    </script><script>

      /* Accordion Popup JavaScript - Moves modals to body for proper z-index stacking */

(function() {
  'use strict';

  // Move all popup modals to body for proper z-index stacking
  function movePopupsToBody() {
    document.querySelectorAll('.popup-modal[data-popup-modal]').forEach(function(popup) {
      // Only move if not already a direct child of body
      if (popup.parentElement !== document.body) {
        document.body.appendChild(popup);
      }
    });
  }

  function initAccordionPopups() {
    // First, move popups to body level
    movePopupsToBody();

    // Open popup via trigger link
    document.querySelectorAll('[data-popup-trigger]').forEach(function(trigger) {
      // Remove existing listeners to prevent duplicates
      trigger.removeEventListener('click', handleTriggerClick);
      trigger.addEventListener('click', handleTriggerClick);
    });

    // Close popup via close button or overlay click
    document.querySelectorAll('[data-popup-close]').forEach(function(closeBtn) {
      closeBtn.removeEventListener('click', handleCloseClick);
      closeBtn.addEventListener('click', handleCloseClick);
    });
  }

  function handleTriggerClick(e) {
    e.preventDefault();
    var blockId = this.getAttribute('data-popup-trigger');
    var popup = document.querySelector('[data-popup-modal="' + blockId + '"]');
    if (popup) {
      popup.classList.add('is-active');
      document.body.style.overflow = 'hidden';
    }
  }

  function handleCloseClick(e) {
    e.preventDefault();
    var blockId = this.getAttribute('data-popup-close');
    var popup = document.querySelector('[data-popup-modal="' + blockId + '"]');
    if (popup) {
      popup.classList.remove('is-active');
      document.body.style.overflow = '';
    }
  }

  // Close on escape key (only add once)
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var activePopup = document.querySelector('.popup-modal.is-active');
      if (activePopup) {
        activePopup.classList.remove('is-active');
        document.body.style.overflow = '';
      }
    }
  });

  // Initialize on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAccordionPopups);
  } else {
    initAccordionPopups();
  }

  // Re-initialize for Shopify sections (if using Section Rendering API)
  document.addEventListener('shopify:section:load', initAccordionPopups);
})();
