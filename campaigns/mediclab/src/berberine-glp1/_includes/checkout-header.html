<section class="checkout-header ml-header">
  <div class="container">
    <div class="checkout-header__inner">
      <div class="checkout-header__brand"><img src="{{ 'images/ml/mediclab-logo-white.png' | campaign_asset }}" loading="eager" alt="{{ campaign.store_name }}" class="brand-logo" width="160" height="33"></div>
      <div class="checkout-header__extras">
        <div class="ml-header__help">Questions? <a href="{{ campaign.store_phone_tel }}">{{ campaign.store_phone }}</a><span class="hide-tablet"> · <a href="mailto:{{ campaign.store_email }}">{{ campaign.store_email }}</a></span></div>
      </div>
    </div>
  </div>
</section>
