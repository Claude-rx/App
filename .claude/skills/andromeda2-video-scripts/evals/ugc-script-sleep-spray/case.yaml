schema_version: "1.1"
name: ugc-script-sleep-spray
expected_outcome: |
  A time-coded 45-second script with voiceover, on-screen text, visuals/shots and editor notes; a hook in the
  first 3 seconds plus 3-5 alternative hooks; the 3 a.m. moment dramatised in sensory detail; the dream outcome
  shown as a concrete next-morning scene; a simple named mechanism; a CTA with offer/risk reversal; sound-off
  captions and fast cuts; no medical/sleep-disorder cure claims.
