<script>
(function() {
  var PRODUCTS = [{"title": "Color Changing Foundation", "price": "39.00", "variant_id": "45097716285596", "image": "{{ 'sf/img/ColorChangingFoundation-Productimagesphotos_639aab4b-1799-45-af4a0e.png'|asset_url }}", "handle": "color-changing-foundation", "badge": "\u2b50 Hero Product"}, {"title": "Extreme Lip Plumper", "price": "39.00", "variant_id": "44663423959196", "image": "{{ 'sf/img/ELPC-1600w-9db6e8.png'|asset_url }}", "handle": "extreme-lip-plumper", "badge": "\ud83d\udd25 Bestseller"}, {"title": "Normal Lip Plumper", "price": "39.00", "variant_id": "44663453876380", "image": "{{ 'sf/img/ELPC_d895921e-0066-4d7f-852d-19866356f9f4-1600w-b32bb1.png'|asset_url }}", "handle": "hyaluronic-acid-lip-plumper", "badge": ""}, {"title": "Eyelash Growth Serum", "price": "39.00", "variant_id": "44630578167964", "image": "{{ 'sf/img/1_baf8104b-c432-4b62-af61-27a2c0166176-1600w-acddab.png'|asset_url }}", "handle": "eyelash-serum", "badge": "\ud83d\udca7 Growth Formula"}, {"title": "Eyebrow Growth Serum", "price": "39.00", "variant_id": "44630578266268", "image": "{{ 'sf/img/1_5abef206-af49-4330-b807-2d7403d6c81e-1600w-d00d41.png'|asset_url }}", "handle": "eyebrow-serum", "badge": ""}, {"title": "Fibre Brow Gel", "price": "39.00", "variant_id": "46514010456220", "image": "{{ 'sf/img/1_a3c6413d-de5f-4c48-aa87-4c433f7ad347-1600w-5bee9b.png'|asset_url }}", "handle": "brow-gel", "badge": "\u2728 New"}, {"title": "Lash & Brow Growth Kit", "price": "49.00", "variant_id": "44630586523804", "image": "{{ 'sf/img/jsdfsd-1600w-3e3e9c.jpg'|asset_url }}", "handle": "lash-brow-duo", "badge": "\ud83c\udf81 Kit Deal"}, {"title": "2-in-1 Serum Mascara", "price": "39.00", "variant_id": "45056292978844", "image": "{{ 'sf/img/1_20b6ec93-6006-4a9f-9321-81c12e325c04-1600w-380b76.png'|asset_url }}", "handle": "long-lash-mascara", "badge": "\ud83d\udcab 2-in-1"}, {"title": "Liquid Blender Brush", "price": "29.00", "variant_id": "46053902155932", "image": "{{ 'sf/img/1_dc0c4f7a-6f9d-4866-870f-5d39a75f4867-1600w-2dee66.png'|asset_url }}", "handle": "liquid-blender-brush", "badge": ""}, {"title": "Beauty Blender", "price": "9.00", "variant_id": "45737078194332", "image": "{{ 'sf/img/1_f4abad2e-bd5e-4735-ab86-6a72861225c5-1600w-92548c.png'|asset_url }}", "handle": "beauty-blender", "badge": ""}];

  var DISCOUNTS = { 2: 10, 3: 15, 4: 20 };
  var selected = [];
  var MAX = 4;

  function formatPrice(cents) {
    return '$' + parseFloat(cents).toFixed(2);
  }

  function getDiscount() {
    var n = selected.length;
    if (n >= 4) return 20;
    if (n >= 3) return 15;
    if (n >= 2) return 10;
    return 0;
  }

  function render() {
    var n = selected.length;
    var disc = getDiscount();

    // Progress bar
    document.getElementById('bb-progress-num').textContent = n;
    document.getElementById('bb-progress-fill').style.width = (n / MAX * 100) + '%';
    ['2','3','4'].forEach(function(k) {
      var dot = document.getElementById('bb-dot-' + k);
      if (n >= parseInt(k)) dot.classList.add('passed');
      else dot.classList.remove('passed');
    });

    // Tier highlights
    [2,3,4].forEach(function(k) {
      var el = document.getElementById('bb-tier-' + k);
      if (n >= k) el.classList.add('active');
      else el.classList.remove('active');
    });

    // Cards
    var cards = document.querySelectorAll('.bb-card');
    cards.forEach(function(card) {
      var vid = card.getAttribute('data-vid');
      var isSel = selected.indexOf(vid) !== -1;
      var isDisabled = !isSel && n >= MAX;
      card.classList.toggle('selected', isSel);
      card.classList.toggle('disabled', isDisabled);
      var btn = card.querySelector('.bb-card-add');
      if (btn) btn.textContent = isSel ? '✓ Added' : '+ Add to Bundle';

      // Update price display — full price only
      var priceEl = card.querySelector('.bb-card-price');
      if (priceEl) {
        var base = parseFloat(card.getAttribute('data-price'));
        priceEl.innerHTML = formatPrice(base);
      }
    });

    // Max notice
    var notice = document.getElementById('bb-max-notice');
    notice.classList.toggle('visible', n >= MAX);

    // Sticky bar
    var sticky = document.getElementById('bb-sticky');
    sticky.classList.toggle('visible', n > 0);

    var rawTotal = selected.reduce(function(acc, vid) {
      var p = PRODUCTS.find(function(x) { return x.variant_id === vid; });
      return acc + (p ? parseFloat(p.price) : 0);
    }, 0);

    var countEl = document.getElementById('bb-sticky-count');
    var totalEl = document.getElementById('bb-sticky-total');

    if (n === 0) {
      countEl.innerHTML = '0 items selected — add at least 2 to add to cart';
      totalEl.innerHTML = '';
    } else if (n === 1) {
      countEl.innerHTML = '<strong>1 item</strong> selected — add 1 more to unlock the bundle';
      totalEl.innerHTML = formatPrice(rawTotal);
    } else {
      countEl.innerHTML = '<strong>' + n + ' item' + (n > 1 ? 's' : '') + '</strong> selected';
      totalEl.innerHTML = formatPrice(rawTotal);
    }

    var ctaBtn = document.getElementById('bb-cta-btn');
    ctaBtn.disabled = n < 2;
  }

  function toggleProduct(vid) {
    var idx = selected.indexOf(vid);
    if (idx !== -1) {
      selected.splice(idx, 1);
    } else {
      if (selected.length >= MAX) return;
      selected.push(vid);
    }
    render();
  }

  window.bbAddToCart = function() {
    if (selected.length < 2) return;
    var cartStr = selected.map(function(vid) { return vid + ':1'; }).join(',');
    window.SFCommerce.addPermalink(cartStr);
  };

  // Build grid
  var grid = document.getElementById('bb-grid');
  PRODUCTS.forEach(function(p) {
    var card = document.createElement('div');
    card.className = 'bb-card';
    card.setAttribute('data-vid', p.variant_id);
    card.setAttribute('data-price', p.price);
    card.innerHTML =
      (p.badge ? '<div class="bb-card-badge">' + p.badge + '</div>' : '') +
      '<div class="bb-card-check">' +
        '<svg width="14" height="14" viewBox="0 0 14 14" fill="none">' +
          '<polyline points="2,7 5.5,10.5 12,3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>' +
      '</div>' +
      '<img class="bb-card-img" src="' + p.image + '" alt="' + p.title + '" loading="lazy">' +
      '<div class="bb-card-body">' +
        '<div class="bb-card-title">' + p.title + '</div>' +
        '<div class="bb-card-price">$' + parseFloat(p.price).toFixed(2) + '</div>' +
        '<button class="bb-card-add">+ Add to Bundle</button>' +
      '</div>';

    card.addEventListener('click', function() {
      toggleProduct(p.variant_id);
    });
    grid.appendChild(card);
  });

  render();
})();
</script></div>
